<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Grava Perfumes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Roboto', sans-serif; }
        body {
            background-color: #F2F2F0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(201,168,76,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(61,61,61,0.05) 0%, transparent 50%);
        }
        .btn-login {
            background: linear-gradient(135deg, #3D3D3D 0%, #5A5A5A 100%);
            color: #fff;
            font-weight: 500;
            transition: all 0.25s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(61,61,61,0.25);
        }
        input:focus {
            border-color: #C9A84C !important;
            box-shadow: 0 0 0 3px rgba(201,168,76,0.12) !important;
            outline: none !important;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">

        <!-- Logo -->
        <div class="text-center mb-8">
            {% load static %}
            <img src="{% static 'perfumes/img/logo.jpeg' %}" alt="Grava Perfumes"
                 class="w-20 h-20 object-contain mx-auto mb-5">
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Grava Perfumes</h1>
            <p class="text-gray-500 text-sm mt-1">Sistema de Gestão de Vendas</p>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-8">

            {% if error %}
            <div class="bg-red-50 border border-red-200 rounded-lg p-3 mb-5 flex items-center gap-2">
                <i class="fas fa-exclamation-circle text-red-400 text-sm"></i>
                <p class="text-red-600 text-sm">{{ error }}</p>
            </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Usuário</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" name="username" required autofocus
                            class="w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-lg text-sm"
                            placeholder="Digite seu usuário">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Senha</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" name="password" required
                            class="w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-lg text-sm"
                            placeholder="Digite sua senha">
                    </div>
                </div>

                <button type="submit" class="btn-login w-full py-3 rounded-lg text-sm">
                    <i class="fas fa-sign-in-alt mr-2"></i>Entrar
                </button>
            </form>
        </div>

        <p class="text-center text-gray-400 text-xs mt-6">&copy; 2026 Grava Perfumes</p>
    </div>
</body>
</html>
