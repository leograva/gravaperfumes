<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Grava Perfumes{% endblock %}</title>
    {% load static %}
    <link rel="icon" type="image/jpeg" href="{% static 'perfumes/img/logo.jpeg' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* ─── Paleta Grava Perfumes (novo logo monocromático) ─── */
        :root {
            --charcoal:       #3D3D3D;   /* cinza carvão — cor principal */
            --charcoal-light: #5A5A5A;   /* carvão médio */
            --charcoal-soft:  #F2F2F0;   /* fundo quase branco */
            --gold:           #C9A84C;   /* dourado — destaque */
            --gold-light:     #E8D08A;   /* dourado claro */
            --gold-pale:      #FAF3DC;   /* dourado pálido — fundo sutil */
            --white:          #FFFFFF;
            --border:         #E5E5E3;
        }

        * { font-family: 'Roboto', sans-serif; }

        /* Gradientes */
        .gradient-gold    { background: linear-gradient(135deg, #C9A84C 0%, #E8D08A 100%); }
        .gradient-charcoal{ background: linear-gradient(135deg, #3D3D3D 0%, #5A5A5A 100%); }
        .gradient-soft    { background: linear-gradient(135deg, #F2F2F0 0%, #E8E8E6 100%); }

        /* Textos */
        .text-grava-gold    { color: var(--gold); }
        .text-grava-charcoal{ color: var(--charcoal); }

        /* Bordas */
        .border-grava-gold    { border-color: var(--gold); }
        .border-grava-charcoal{ border-color: var(--charcoal); }

        /* Backgrounds */
        .bg-grava-gold     { background-color: var(--gold); }
        .bg-grava-charcoal { background-color: var(--charcoal); }
        .bg-grava-soft     { background-color: var(--charcoal-soft); }

        /* Sombras */
        .shadow-grava    { box-shadow: 0 4px 20px rgba(201, 168, 76, 0.18); }
        .shadow-grava-lg { box-shadow: 0 8px 32px rgba(61, 61, 61, 0.10); }

        /* Card padrão */
        .card-grava {
            background: var(--white);
            border: 1px solid var(--border);
        }

        /* Botão principal */
        .btn-grava {
            background: linear-gradient(135deg, #3D3D3D 0%, #5A5A5A 100%);
            color: #ffffff;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-grava:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(61, 61, 61, 0.25);
            background: linear-gradient(135deg, #2a2a2a 0%, #3D3D3D 100%);
        }

        /* Botão dourado */
        .btn-gold {
            background: linear-gradient(135deg, #C9A84C 0%, #E8D08A 100%);
            color: #3D3D3D;
            font-weight: 600;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(201, 168, 76, 0.35);
        }

        /* Navbar */
        .navbar-grava {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        /* Background da página */
        .bg-pattern {
            background-color: var(--charcoal-soft);
            background-image:
                radial-gradient(circle at 15% 25%, rgba(201, 168, 76, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 85% 75%, rgba(61, 61, 61, 0.04) 0%, transparent 50%);
        }

        /* Stat card */
        .stat-card { position: relative; overflow: hidden; }
        .stat-card::before {
            content: '';
            position: absolute;
            top: -20px; right: -20px;
            width: 90px; height: 90px;
            background: radial-gradient(circle, rgba(201, 168, 76, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* Hover lift */
        .hover-lift { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-lift:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 36px rgba(61, 61, 61, 0.12);
        }

        /* Icon wrapper */
        .icon-wrapper {
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 14px;
            font-size: 22px;
            flex-shrink: 0;
        }

        /* Badge */
        .badge-status {
            font-size: 11px; font-weight: 600;
            letter-spacing: 0.4px;
            padding: 3px 10px;
            border-radius: 10px;
            display: inline-block;
        }

        /* Inputs */
        input[type="text"], input[type="email"], input[type="number"],
        input[type="password"], input[type="date"], select, textarea {
            border: 1.5px solid var(--border) !important;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--gold) !important;
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.12) !important;
            outline: none !important;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: var(--charcoal-soft); }
        ::-webkit-scrollbar-thumb { background: #C9A84C; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b8943a; }

        /* Linha de destaque dourada */
        .gold-accent { border-left: 3px solid var(--gold); }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'grava-gold':     '#C9A84C',
                        'grava-charcoal': '#3D3D3D',
                        'grava-soft':     '#F2F2F0',
                        'grava-border':   '#E5E5E3',
                        /* aliases para não quebrar templates antigos */
                        'grava-coral':    '#C9A84C',
                        'grava-purple':   '#3D3D3D',
                        'grava-beige':    '#F2F2F0',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-pattern min-h-screen">

    <!-- Navbar -->
    <nav class="navbar-grava shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">

                <!-- Logo -->
                <div class="flex items-center">
                    <a href="{% url 'dashboard' %}" class="flex items-center space-x-3">
                        <img src="{% static 'perfumes/img/logo.jpeg' %}" alt="Grava Perfumes"
                             class="w-9 h-9 object-contain">
                        <span class="text-xl font-bold text-grava-charcoal tracking-tight">
                            Grava Perfumes
                        </span>
                    </a>
                </div>

                <!-- Nav links -->
                <div class="hidden md:flex items-center space-x-1">
                    <a href="{% url 'dashboard' %}"
                       class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-grava-charcoal transition font-medium text-sm">
                        <i class="fas fa-home mr-2 text-grava-gold"></i>Dashboard
                    </a>
                    <a href="{% url 'venda_lista' %}"
                       class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-grava-charcoal transition font-medium text-sm">
                        <i class="fas fa-shopping-cart mr-2 text-grava-gold"></i>Vendas
                    </a>
                    <a href="{% url 'cliente_lista' %}"
                       class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-grava-charcoal transition font-medium text-sm">
                        <i class="fas fa-users mr-2 text-grava-gold"></i>Clientes
                    </a>
                    <a href="{% url 'perfume_lista' %}"
                       class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-grava-charcoal transition font-medium text-sm">
                        <i class="fas fa-spray-can mr-2 text-grava-gold"></i>Perfumes
                    </a>
                    <a href="{% url 'marca_lista' %}"
                       class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-grava-charcoal transition font-medium text-sm">
                        <i class="fas fa-tag mr-2 text-grava-gold"></i>Marcas
                    </a>
                </div>

                <!-- Ações -->
                <div class="flex items-center gap-3">
                    <a href="{% url 'venda_criar' %}" class="btn-grava px-5 py-2.5 rounded-lg text-sm">
                        <i class="fas fa-plus mr-2"></i>Nova Venda
                    </a>
                    <a href="{% url 'logout' %}"
                       class="px-3 py-2 rounded-lg text-gray-500 hover:bg-red-50 hover:text-red-500 transition text-sm">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Messages -->
    {% if messages %}
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 space-y-2">
        {% for message in messages %}
        <div class="bg-white border-l-4 border-grava-gold rounded-lg shadow-grava p-4 flex items-center gap-3">
            <div class="w-9 h-9 rounded-full gradient-gold flex items-center justify-center flex-shrink-0">
                <i class="fas fa-check text-white text-sm"></i>
            </div>
            <p class="text-gray-700 font-medium text-sm">{{ message }}</p>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white mt-12 py-5 border-t border-grava-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <p class="text-gray-500 text-sm">&copy; 2026 Grava Perfumes</p>
            <p class="text-gray-400 text-xs">Sistema de Gestão de Vendas</p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
