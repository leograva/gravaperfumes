{% extends 'perfumes/base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="card-grava rounded-2xl shadow-grava-lg p-8">
        <h1 class="text-2xl font-bold text-grava-purple mb-6">{{ titulo }}</h1>
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Nome *</label>
                {{ form.nome }}
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Gênero</label>
                    {{ form.genero }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Celular *</label>
                    {{ form.celular }}
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Instagram</label>
                    {{ form.instagram }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    {{ form.email }}
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Observações</label>
                {{ form.observacoes }}
            </div>
            <div class="flex items-center">
                {{ form.ativo }}
                <label class="ml-2 text-sm text-gray-700">Cliente ativo</label>
            </div>
            <div class="flex gap-4">
                <button type="submit" class="flex-1 btn-grava py-3 rounded-lg font-medium">
                    <i class="fas fa-save mr-2"></i>Salvar
                </button>
                <a href="{% url 'cliente_lista' %}" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg hover:bg-gray-300 transition text-center font-medium">
                    <i class="fas fa-times mr-2"></i>Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
